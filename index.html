const $ = id => document.getElementById(id);

let BANK = {};
let allWords = [];

let selected = new Set(CATEGORIES);

/* 단어 제목 정리 */

function cleanTitle(raw) {

  let title = raw
    .replace(/_/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  title = title.replace(
    /\s*\((배우|가수|방송인|영화|드라마|애니메이션|만화|축구 선수|야구 선수)\)$/,
    ""
  );

  if (title.length < 2 || title.length > 50) {
    return "";
  }

  if (
    /(목록|방법|과정|개념|이론|법칙|현상|사건|논란|학문|산업|하는 법|하기)$/.test(title)
  ) {
    return "";
  }

  if (
    /^(분류|파일|틀|위키백과):/.test(title)
  ) {
    return "";
  }

  return title;
}


/* 위키백과 카테고리에서 제목 수집 */

async function collectCategory(root, target) {

  const results = [];
  const found = new Set();

  const queue = [{
    title: "분류:" + root,
    depth: 0
  }];

  const seenCats = new Set();

  let requests = 0;
  const maxRequests = 12;

  while (
    queue.length &&
    results.length < target &&
    requests < maxRequests
  ) {

    const current = queue.shift();

    if (seenCats.has(current.title)) {
      continue;
    }

    seenCats.add(current.title);

    let continuation = null;

    do {

      const params = new URLSearchParams({
        action: "query",
        list: "categorymembers",
        cmtitle: current.title,
        cmlimit: "500",
        cmtype: "page|subcat",
        format: "json",
        origin: "*"
      });

      if (continuation) {
        params.set("cmcontinue", continuation);
      }

      try {

        const response = await fetch(
          API + "?" + params.toString()
        );

        if (!response.ok) {
          break;
        }

        const data = await response.json();

        const members =
          data.query?.categorymembers || [];

        for (const member of members) {

          if (member.ns === 0) {

            const title = cleanTitle(member.title);

            if (title && !found.has(title)) {
              found.add(title);
              results.push(title);
            }

          } else if (
            member.ns === 14 &&
            current.depth < 2 &&
            queue.length < 80
          ) {

            queue.push({
              title: member.title,
              depth: current.depth + 1
            });

          }

        }

        continuation =
          data.continue?.cmcontinue || null;

      } catch (error) {

        continuation = null;

      }

      requests++;

      if (continuation) {
        await new Promise(resolve =>
          setTimeout(resolve, 80)
        );
      }

    } while (
      continuation &&
      results.length < target &&
      requests < maxRequests
    );

  }

  return results;
}


/* 카테고리별 단어 목록 구성 */

async function loadOneCategory(category) {

  const words = [...FALLBACK[category]];
  const found = new Set(words);

  for (const root of ROOTS[category]) {

    if (words.length >= 500) {
      break;
    }

    const need = 500 - words.length;

    const fetched = await collectCategory(
      root,
      need
    );

    for (const raw of fetched) {

      const title = cleanTitle(raw);

      if (title && !found.has(title)) {
        found.add(title);
        words.push(title);
      }

      if (words.length >= 500) {
        break;
      }

    }

  }

  return words;
}


/* 최대 2000개의 중복 없는 단어 구성 */

async function loadBank() {

  $("start").disabled = true;

  const rawBank = {};

  try {

    for (const category of CATEGORIES) {

      $("loadStatus").textContent =
        category + " 단어를 불러오는 중...";

      rawBank[category] =
        await loadOneCategory(category);

    }

  } catch (error) {

    for (const category of CATEGORIES) {
      rawBank[category] =
        rawBank[category] || [...FALLBACK[category]];
    }

  }

  /*
    카테고리별로 최대 500개를 수집한 뒤
    중복을 제거하고 최대 2000개를 구성한다.
  */

  BANK = {};

  const quotas = {
    "인물": 334,
    "사물": 334,
    "방송명": 333,
    "영화": 333,
    "드라마": 333,
    "만화·애니메이션": 333
  };

  const used = new Set();

  for (const category of CATEGORIES) {

    BANK[category] = [];

    for (const word of rawBank[category]) {

      if (
        BANK[category].length >= quotas[category]
      ) {
        break;
      }

      if (!used.has(word)) {
        used.add(word);
        BANK[category].push(word);
      }

    }

  }

  /*
    어떤 카테고리의 단어가 부족하면
    다른 카테고리에 남아 있는 단어로 보충한다.
  */

  for (const category of CATEGORIES) {

    for (const word of rawBank[category]) {

      if (used.size >= 2000) {
        break;
      }

      if (!used.has(word)) {
        used.add(word);
        BANK[category].push(word);
      }

    }

    if (used.size >= 2000) {
      break;
    }

  }

  allWords = [...used];

  $("loadStatus").textContent =
    "확보한 단어: " + allWords.length +
    "개 / 목표 2,000개\n" +
    "카테고리를 선택하고 게임을 시작해 줘!";

  $("start").disabled = false;
  $("start").textContent = "게임 시작하기 🚀";

}


/* 카테고리 선택 */

$("categories")

    button.onclick = () => {

      if (selected.has(category)) {

        selected.delete(category);
        button.classList.remove("on");

      } else {

$("selectAll").onclick = () => {

  const allSelected =
    selected.size === CATEGORIES.length;

  if (allSelected) {

    selected.clear();

  } else {

    selected = new Set(CATEGORIES);

  }

  $("categories")
    .querySelectorAll("button")
    .forEach(button => {

      button.classList.toggle(
        "on",
        selected.has(button.dataset.cat)
      );

    });

};


/* 화면 전환 */

function section(id) {

  ["setup", "game", "result"].forEach(name => {

    $(name).classList.toggle(
      "hidden",
      name !== id
    );

  });

}
