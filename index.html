<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIME'S UP PARTY 🎉</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff8f5;
  color: #35264f;
  font-family: Arial, sans-serif;
}

main {
  max-width: 520px;
  margin: auto;
  padding: 20px 16px 40px;
}

header {
  text-align: center;
  font-size: 23px;
  font-weight: 900;
  color: #8058ef;
  padding: 12px;
}

.hero {
  text-align: center;
  padding: 20px 0;
}

.emoji {
  font-size: 60px;
}

h1 {
  font-size: 35px;
  margin: 12px 0;
}

h1 span {
  color: #8058ef;
}

p {
  color: #8c819d;
  line-height: 1.6;
}

.box {
  background: white;
  border: 2px solid #eee5ff;
  border-radius: 22px;
  padding: 20px;
  margin: 15px 0;
  box-shadow: 0 4px 0 #eee5ff;
}

label {
  display: block;
  margin: 18px 0 9px;
  font-weight: bold;
}

select {
  width: 100%;
  padding: 13px;
  border: 2px solid #eee5ff;
  border-radius: 12px;
  background: white;
  color: #35264f;
  font-size: 15px;
}

button {
  cursor: pointer;
  border: 0;
  font-size: 15px;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.primary {
  display: block;
  width: 100%;
  padding: 16px;
  border-radius: 15px;
  background: #8058ef;
  color: white;
  margin-top: 15px;
  font-size: 18px;
}

.category-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.category {
  background: #faf7ff;
  color: #635477;
  border: 2px solid #eee5ff;
  border-radius: 12px;
  padding: 13px 5px;
}

.category.on {
  background: #eee7ff;
  border-color: #8058ef;
  color: #8058ef;
}

.small-button {
  background: #f1ebff;
  color: #8058ef;
  padding: 10px 13px;
  border-radius: 10px;
}

.status {
  background: #f7f1ff;
  padding: 12px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
  white-space: pre-line;
}

.hidden {
  display: none !important;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.pill {
  background: #ffe66d;
  padding: 10px 12px;
  border-radius: 12px;
  font-weight: bold;
}

#timer {
  font-size: 28px;
  font-weight: 900;
}

.card {
  background: linear-gradient(145deg, #9878ff, #6843df);
  color: white;
  border-radius: 25px;
  padding: 28px 15px;
  margin: 18px 0;
  min-height: 230px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.card-label {
  font-size: 13px;
  letter-spacing: 2px;
}

#word {
  font-size: clamp(30px, 8vw, 45px);
  font-weight: 900;
  margin: 28px 0;
  overflow-wrap: anywhere;
}

#readyMessage {
  font-size: 22px;
  font-weight: bold;
  line-height: 1.6;
  margin-top: 25px;
}

#hint {
  font-size: 14px;
  margin-top: 12px;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.actions button {
  padding: 18px 5px;
  border-radius: 14px;
}

.yes {
  background: #c9f5d8;
  color: #176b3b;
}

.skip {
  background: #ffe0eb;
  color: #ad3159;
}

.scores {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 18px 0;
}

.score {
  background: white;
  border: 2px solid #eee5ff;
  border-radius: 15px;
  padding: 15px 5px;
  text-align: center;
}

.score strong {
  display: block;
  font-size: 32px;
  margin-top: 7px;
}

.note {
  font-size: 12px;
  text-align: center;
}
</style>
</head>

<body>
<main>

<header>🎉 TIME'S UP PARTY</header>

<!-- 게임 설정 -->

<section id="setup">

  <div class="hero">
    <div class="emoji">🎲</div>
    <h1>설명하고<br><span>맞혀봐!</span></h1>
    <p>친구들과 함께하는 신나는 단어 게임 💜</p>
  </div>

  <div class="box">

    <label>🃏 출제할 단어 개수</label>

    <select id="count">
      <option value="20">20개</option>
      <option value="40" selected>40개</option>
      <option value="60">60개</option>
      <option value="100">100개</option>
      <option value="200">200개</option>
      <option value="500">500개</option>
      <option value="1000">1000개</option>
      <option value="2000">2000개</option>
    </select>

    <label>🎨 단어 카테고리</label>

    <button class="small-button" id="selectAll">
      전체 선택 / 전체 해제
    </button>

    <div class="category-grid" id="categories"
         style="margin-top:12px">

      <button class="category on" data-cat="인물">
        🧑 인물
      </button>

      <button class="category on" data-cat="사물">
        🏠 사물
      </button>

      <button class="category on" data-cat="방송명">
        📺 방송명
      </button>

      <button class="category on" data-cat="영화">
        🎬 영화
      </button>

      <button class="category on" data-cat="노래 제목">
        🎵 노래 제목
      </button>

      <button class="category on" data-cat="만화·애니메이션">
        🐰 만화·애니
      </button>

    </div>

    <label>⏱️ 턴 제한 시간</label>

    <div class="status">
      40초 고정 · 팀이 바뀌면 시작 버튼을 눌러야 진행돼!
    </div>

    <label>📚 단어 목록</label>

    <div id="loadStatus" class="status">
      단어 목록을 확인하고 있어요...
    </div>

    <button class="primary" id="start" disabled>
      단어 목록 확인 중...
    </button>

  </div>

  <p class="note">
    ※ 단어는 words.js 파일에서 불러옵니다.
  </p>

</section>


<!-- 게임 화면 -->

<section id="game" class="hidden">

  <div class="top">
    <div class="pill" id="round">1라운드 / 3라운드</div>
    <div id="timer">40초</div>
  </div>

  <div class="box">

    <div class="top">
      <b id="team">💜 A팀 차례</b>
      <span id="left">남은 단어 40개</span>
    </div>

    <p id="roundRule">
      🗣️ 말로 자유롭게 설명하기
    </p>

  </div>

  <div class="card">

    <div class="card-label">✨ TIME'S UP ✨</div>

    <div id="readyMessage">
      A팀 준비됐나요?
    </div>

    <div id="word" class="hidden"></div>

    <div id="hint">
      시작 버튼을 눌러 주세요!
    </div>

  </div>

  <button class="primary" id="beginTurn">
    🚀 시작하기
  </button>

  <div class="actions hidden" id="actions">

    <button class="yes" id="correct">
      ✅ 정답!
    </button>

    <button class="skip" id="pass">
      ⏭️ 패스
    </button>

  </div>

  <div class="scores">

    <div class="score">
      💜 A팀
      <strong id="a">0</strong>
    </div>

    <div class="score">
      💛 B팀
      <strong id="b">0</strong>
    </div>

  </div>

  <button class="primary hidden" id="end">
    턴 종료하기
  </button>

  <p class="note">
    정답 버튼을 눌러야 점수가 올라가!
  </p>

</section>


<!-- 결과 화면 -->

<section id="result" class="hidden">

  <div class="hero">
    <div class="emoji">🏆</div>
    <h1>게임 <span>종료!</span></h1>
    <p id="winner"></p>
  </div>

  <div class="scores">

    <div class="score">
      💜 A팀
      <strong id="fa">0</strong>
    </div>

    <div class="score">
      💛 B팀
      <strong id="fb">0</strong>
    </div>

  </div>

  <button class="primary" id="again">
    다시 플레이하기 🎉
  </button>

</section>

</main>


<!-- words.js를 먼저 불러오기 -->

<script src="./words.js"></script>

<script>

/* =====================================
   1. 기본 설정
===================================== */

const CATEGORIES = [
  "인물",
  "사물",
  "방송명",
  "영화",
  "노래 제목",
  "만화·애니메이션"
];

const $ = id => document.getElementById(id);

let BANK = {};

let selected = new Set(CATEGORIES);

let deck = [];
let remaining = [];
let passedWords = [];

let roundNo = 0;
let teamNo = 0;

let scores = [0, 0];

let time = 40;
let interval = null;
let active = false;


/* =====================================
   2. 카테고리 이름 연결
===================================== */

const CATEGORY_ALIASES = {

  "인물": [
    "인물"
  ],

  "사물": [
    "사물"
  ],

  "방송명": [
    "방송명"
  ],

  "영화": [
    "영화"
  ],

  "노래 제목": [
    "노래 제목",
    "노래제목",
    "노래"
  ],

  "만화·애니메이션": [
    "만화·애니메이션",
    "만화",
    "애니메이션",
    "만화·애니"
  ]

};


/* =====================================
   3. words.js에서 단어 불러오기
===================================== */

function loadBank() {

  $("start").disabled = true;

  const source = window.TIMESUP_WORDS || {};

  BANK = {};

  const allUniqueWords = new Set();

  for (const category of CATEGORIES) {

    const aliases =
      CATEGORY_ALIASES[category] || [category];

    let collected = [];

    for (const key of aliases) {

      const list = source[key];

      if (Array.isArray(list)) {
        collected.push(...list);
      }

    }

    BANK[category] = [
      ...new Set(
        collected
          .filter(word =>
            typeof word === "string"
          )
          .map(word => word.trim())
          .filter(word =>
            word.length >= 2 &&
            word.length <= 80
          )
      )
    ];

    BANK[category].forEach(word => {
      allUniqueWords.add(word);
    });

  }

  if (allUniqueWords.size === 0) {

    $("loadStatus").textContent =
      "단어를 불러오지 못했어요.\n" +
      "words.js 파일과 카테고리 이름을 확인해 주세요.";

    $("start").disabled = true;

    $("start").textContent =
      "단어 목록 확인 필요";

    return;

  }

  $("loadStatus").textContent =
    "단어 목록 준비 완료!\n" +
    "전체 고유 단어: " + allUniqueWords.size + "개\n\n" +
    CATEGORIES.map(category =>
      category + ": " + BANK[category].length + "개"
    ).join("\n");

  $("start").disabled = false;

  $("start").textContent =
    "게임 시작하기 🚀";

}


/* =====================================
   4. 단어 무작위 섞기
===================================== */

function shuffle(array) {

  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {

    const j = Math.floor(
      Math.random() * (i + 1)
    );

    [result[i], result[j]] =
      [result[j], result[i]];

  }

  return result;

}


/* =====================================
   5. 카테고리 선택
===================================== */

$("categories")
  .querySelectorAll("button")
  .forEach(button => {

    button.onclick = () => {

      const category = button.dataset.cat;

      if (selected.has(category)) {

        selected.delete(category);

        button.classList.remove("on");

      } else {

        selected.add(category);

        button.classList.add("on");

      }

    };

  });


$("selectAll").onclick = () => {

  if (selected.size === CATEGORIES.length) {

    selected.clear();

  } else {

    selected = new Set(CATEGORIES);

  }

  $("categories")
    .querySelectorAll("button")
    .forEach(button => {

      button.classList.toggle(
        "on",
        selected.has(button.dataset.cat)
      );

    });

};


/* =====================================
   6. 화면 전환
===================================== */

function section(id) {

  ["setup", "game", "result"].forEach(name => {

    $(name).classList.toggle(
      "hidden",
      name !== id
    );

  });

}


/* =====================================
   7. 라운드 표시
===================================== */

function updateRound() {

  $("round").textContent =
    (roundNo + 1) + "라운드 / 3라운드";

  const rules = [
    "🗣️ 말로 자유롭게 설명하기",
    "💬 한 단어로만 설명하기",
    "🎭 말없이 몸짓으로 표현하기"
  ];

  $("roundRule").textContent =
    rules[roundNo];

}


/* =====================================
   8. 점수 표시
===================================== */

function updateScores() {

  $("a").textContent = scores[0];

  $("b").textContent = scores[1];

}


/* =====================================
   9. 팀 표시
===================================== */

function updateTeam() {

  $("team").textContent =
    teamNo === 0
      ? "💜 A팀 차례"
      : "💛 B팀 차례";

}


/* =====================================
   10. 남은 단어 표시
===================================== */

function updateLeft() {

  const totalRemaining =
    remaining.length + passedWords.length;

  $("left").textContent =
    "남은 단어 " + totalRemaining + "개";

}


/* =====================================
   11. 타이머 정지
===================================== */

function stopTimer() {

  if (interval !== null) {

    clearInterval(interval);

    interval = null;

  }

  active = false;

}


/* =====================================
   12. 새 게임 시작
===================================== */

function startGame() {

  if (selected.size === 0) {

    alert("카테고리를 하나 이상 선택해 줘!");

    return;

  }

  const pool = [
    ...new Set(
      [...selected].flatMap(category =>
        BANK[category] || []
      )
    )
  ];

  if (pool.length === 0) {

    alert(
      "선택한 카테고리에 단어가 없어!\n" +
      "words.js 파일을 확인해 줘."
    );

    return;

  }

  const requested = Number($("count").value);

  /*
    선택한 단어들을 한 번 무작위로 섞는다.
    이 순서를 현재 라운드의 기본 순서로 사용한다.
  */

  deck = shuffle(pool).slice(
    0,
    Math.min(requested, pool.length)
  );

  /*
    1라운드는 처음 섞은 순서대로 진행한다.
  */

  remaining = [...deck];

  passedWords = [];

  roundNo = 0;
  teamNo = 0;

  scores = [0, 0];

  time = 40;

  stopTimer();

  updateScores();
  updateRound();
  updateTeam();

  section("game");

  prepareTurn();

}


/* =====================================
   13. 턴 준비 화면
===================================== */

function prepareTurn() {

  stopTimer();

  time = 40;

  $("timer").textContent = "40초";

  updateTeam();
  updateRound();
  updateLeft();

  /*
    다음 팀이 시작 버튼을 누르기 전까지
    단어를 숨겨 둔다.
  */

  $("readyMessage").textContent =
    (teamNo === 0 ? "A팀" : "B팀") +
    " 준비됐나요?";

  $("readyMessage").classList.remove("hidden");

  $("word").textContent = "";

  $("word").classList.add("hidden");

  $("hint").textContent =
    "시작 버튼을 눌러 주세요!";

  $("beginTurn").textContent =
    "🚀 시작하기";

  $("beginTurn").classList.remove("hidden");

  $("actions").classList.add("hidden");

  $("end").classList.add("hidden");

}


/* =====================================
   14. 다음 단어 준비
===================================== */

function prepareNextWord() {

  /*
    일반 단어가 모두 끝났으면
    패스한 단어들을 다시 출제한다.

    패스한 단어의 순서도 유지한다.
  */

  if (
    remaining.length === 0 &&
    passedWords.length > 0
  ) {

    remaining = [...passedWords];

    passedWords = [];

  }

  /*
    일반 단어와 패스 단어가 모두 없으면
    라운드가 끝난 것이다.
  */

  if (
    remaining.length === 0 &&
    passedWords.length === 0
  ) {

    finishRound();

    return false;

  }

  updateLeft();

  return true;

}


/* =====================================
   15. 턴 시작
===================================== */

function beginTurn() {

  if (active) {
    return;
  }

  if (!prepareNextWord()) {
    return;
  }

  active = true;

  time = 40;

  $("timer").textContent = "40초";

  $("readyMessage").classList.add("hidden");

  $("beginTurn").classList.add("hidden");

  $("actions").classList.remove("hidden");

  $("end").classList.remove("hidden");

  $("hint").textContent =
    "정답이면 정답 버튼을 눌러 줘!";

  showCurrentWord();

  /*
    시작 버튼을 누른 순간부터 타이머가 작동한다.
  */

  interval = setInterval(() => {

    time--;

    $("timer").textContent =
      time + "초";

    if (time <= 0) {

      finishTurn();

    }

  }, 1000);

}


/* =====================================
   16. 현재 단어 표시
===================================== */

function showCurrentWord() {

  if (!prepareNextWord()) {
    return;
  }

  $("word").textContent =
    remaining[0];

  $("word").classList.remove("hidden");

  $("readyMessage").classList.add("hidden");

  updateLeft();

}


/* =====================================
   17. 정답 처리
===================================== */

function correctAnswer() {

  if (!active) {
    return;
  }

  /*
    정답을 맞힌 단어는 현재 라운드에서 제거한다.
  */

  remaining.shift();

  scores[teamNo]++;

  updateScores();

  /*
    다음 단어로 이동한다.
    기존 순서는 변경하지 않는다.
  */

  if (!prepareNextWord()) {
    return;
  }

  showCurrentWord();

}


/* =====================================
   18. 패스 처리
===================================== */

function passWord() {

  if (!active || remaining.length === 0) {
    return;
  }

  /*
    패스한 단어는 대기열 뒤로 보낸다.
    다른 단어들을 먼저 진행한 뒤 다시 출제한다.
  */

  const skipped = remaining.shift();

  passedWords.push(skipped);

  if (!prepareNextWord()) {
    return;
  }

  showCurrentWord();

}


/* =====================================
   19. 턴 종료
===================================== */

function finishTurn() {

  /*
    이미 턴이 끝났다면 중복 실행하지 않는다.
  */

  if (!active) {
    return;
  }

  stopTimer();

  /*
    핵심 수정 사항!

    현재 화면에 보이는 단어를 넘긴다.
    정답 점수는 추가하지 않는다.

    따라서 다음 팀은 마지막 단어를
    다시 보지 않고 다음 문제부터 시작한다.
  */

  if (remaining.length > 0) {

    remaining.shift();

  }

  /*
    현재 라운드의 모든 단어를 사용했다면
    다음 라운드로 이동한다.
  */

  if (
    remaining.length === 0 &&
    passedWords.length === 0
  ) {

    finishRound();

    return;

  }

  /*
    팀만 변경한다.

    단어 목록을 다시 섞지 않으므로
    기존 순서는 그대로 유지된다.
  */

  teamNo = teamNo === 0 ? 1 : 0;

  /*
    단어를 숨기고 다음 팀의 준비 화면을 보여 준다.
    타이머는 시작 버튼을 누를 때까지 작동하지 않는다.
  */

  prepareTurn();

}


/* =====================================
   20. 라운드 종료
===================================== */

function finishRound() {

  stopTimer();

  /*
    3라운드까지 끝났다면 최종 결과를 표시한다.
  */

  if (roundNo >= 2) {

    showResult();

    return;

  }

  /*
    다음 라운드로 이동한다.
  */

  roundNo++;

  /*
    라운드가 바뀔 때만 단어 순서를 새로 섞는다.
  */

  remaining = shuffle(deck);

  passedWords = [];

  /*
    새로운 라운드는 A팀부터 시작한다.
  */

  teamNo = 0;

  updateRound();

  prepareTurn();

}


/* =====================================
   21. 게임 결과
===================================== */

function showResult() {

  stopTimer();

  $("fa").textContent = scores[0];

  $("fb").textContent = scores[1];

  if (scores[0] > scores[1]) {

    $("winner").textContent =
      "💜 A팀 승리! 앙!";

  } else if (scores[1] > scores[0]) {

    $("winner").textContent =
      "💛 B팀 승리! 앙!";

  } else {

    $("winner").textContent =
      "🤝 무승부! 앙앙!";

  }

  section("result");

}


/* =====================================
   22. 버튼 연결
===================================== */

$("start").onclick = startGame;

$("beginTurn").onclick = beginTurn;

$("correct").onclick = correctAnswer;

$("pass").onclick = passWord;

$("end").onclick = finishTurn;


$("again").onclick = () => {

  stopTimer();

  section("setup");

  $("start").disabled = false;

  $("start").textContent =
    "게임 시작하기 🚀";

};


/* =====================================
   23. 단어 목록 불러오기
===================================== */

loadBank();

</script>
